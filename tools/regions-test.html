<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><title>Régió teszt</title></head>
<body style="font: 12px monospace; background:#111; color:#ddd">
<pre id="out"></pre>
<script type="module">
import { computeRegions } from '../js/sketch/regions.js';
const out = document.getElementById('out');
const log = (...a) => { out.textContent += a.join(' ') + '\n'; };
const L = (id, a, b) => ({ id, t: 'line', a, b });
const rect = (p, x0, y0, x1, y1) => [L(p + 1, [x0, y0], [x1, y0]), L(p + 2, [x1, y0], [x1, y1]), L(p + 3, [x1, y1], [x0, y1]), L(p + 4, [x0, y1], [x0, y0])];
const cases = {
  'téglalap': [rect('r', 0, 0, 10, 5), 1, [50]],
  'téglalap + kör lyuk': [[...rect('r', 0, 0, 10, 10), { id: 'c', t: 'circle', c: [5, 5], r: 2 }], 2, [100 - Math.PI * 4, Math.PI * 4]],
  'két átfedő téglalap': [[...rect('a', 0, 0, 10, 10), ...rect('b', 5, 5, 15, 15)], 3, [75, 25, 75]],
  'kör egy vonallal kettévágva': [[{ id: 'c', t: 'circle', c: [0, 0], r: 5 }, L('l', [-10, 0], [10, 0])], 2, [Math.PI * 12.5, Math.PI * 12.5]],
  'T-csatlakozás': [[...rect('r', 0, 0, 10, 10), L('t', [5, 0], [5, 10])], 2, [50, 50]],
  'lógó vonal': [[...rect('r', 0, 0, 10, 10), L('d', [10, 10], [20, 20])], 1, [100]],
  'ív + húr': [[{ id: 'a', t: 'arc', c: [0, 0], r: 5, a0: 0, a1: Math.PI }, L('l', [-5, 0], [5, 0])], 1, [Math.PI * 12.5]],
  'zárt spline': [[{ id: 's', t: 'spline', pts: [[0, 0], [10, 0], [10, 10], [0, 10]], closed: true }], 1, [null]],
  'érintő kör téglalapban': [[...rect('r', 0, 0, 10, 10), { id: 'c', t: 'circle', c: [5, 5], r: 5 }], 5, [null]],
  'egymásba ágyazott': [[...rect('a', 0, 0, 30, 30), ...rect('b', 5, 5, 25, 25), ...rect('c', 10, 10, 20, 20)], 3, [500, 300, 100]],
  'slot (2 vonal + 2 ív)': [[L('1', [0, 0], [10, 0]), { id: 'a1', t: 'arc', c: [10, 2], r: 2, a0: -Math.PI / 2, a1: Math.PI / 2 }, L('2', [10, 4], [0, 4]), { id: 'a2', t: 'arc', c: [0, 2], r: 2, a0: Math.PI / 2, a1: Math.PI * 1.5 }], 1, [40 + Math.PI * 4]],
};
for (const [name, [curves, expCount, expAreas]] of Object.entries(cases)) {
  const t0 = performance.now();
  const { regions } = computeRegions(curves.flat());
  const areas = regions.map((r) => Math.round(r.area * 100) / 100).sort((a, b) => a - b);
  const exp = expAreas.filter((a) => a !== null).map((a) => Math.round(a * 100) / 100).sort((a, b) => a - b);
  const ok = regions.length === expCount && (exp.length === 0 || JSON.stringify(areas) === JSON.stringify(exp));
  log(ok ? 'OK  ' : 'FAIL', name, '→', regions.length, 'régió', JSON.stringify(areas), exp.length ? 'várt ' + JSON.stringify(exp) : '', (performance.now() - t0).toFixed(1) + 'ms', regions.map((r) => r.loops.map((l) => l.map((s) => s.t).join('')).join('|')).join(' '));
}
window.testDone = true;
</script>
</body></html>
